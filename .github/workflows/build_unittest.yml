name: build_unittest

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-cmake-windows:
    strategy:
      matrix:
        os: [windows-latest]
    name: ${{ matrix.os }}-CMake
    runs-on: ${{ matrix.os }}
    steps:
    - name: Skip Duplicate Actions
      uses: fkirc/skip-duplicate-actions@v5.3.1
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: configure
      run: |
        ls env:
        mkdir target-Release
        cd target-Release
        cmake .. -DCMAKE_INSTALL_PREFIX=install${{ matrix.os }}CMake-Github
        cd ..
        mkdir target-Debug
        cd target-Debug
        cmake .. -DCMAKE_INSTALL_PREFIX=install${{ matrix.os }}CMake-Github
    - name: build
      run: |
        cd target-Release
        cmake --build . --config Release -j 
        cd ..
        cd target-Debug
        cmake --build . --config Debug -j 
    - name: test # should run w/o install
      run: |
        cd target-Release
        ctest -C Release --output-on-failure
        cd ..
        cd target-Debug
        ctest -C Debug --output-on-failure
    - name: install
      run: |
        cd target-Release
        cmake --build . --config Release --target install
        cd ..
        cd target-Debug
        cmake --build . --config Debug --target install
        cd ..

  build-linux-cmake-default:
    strategy:
      matrix:
        os: [ubuntu-24.04]
    name: ${{ matrix.os }}-CMake
    runs-on: ${{ matrix.os }}
    steps:
    - name: Skip Duplicate Actions
      uses: fkirc/skip-duplicate-actions@v5.3.1
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1 # https://github.com/marketplace/actions/setup-cpp-c-c
      with:
          compiler: gcc-14
    - name: configure
      run: |
        env
        mkdir target && cd target
        cmake .. -DCMAKE_INSTALL_PREFIX=install${{ matrix.os }}CMake-Github
    - name: build
      run: |
        cd target
        # "-j" spawns too many processes causing GCC to crash
        cmake --build . -j 12
    - name: test
    # should run w/o install
      run: |
        cd target
        ctest --output-on-failure
    - name: install
      run: |
        cd target
        cmake --build . --target install

  build-linux-cmake:
    strategy:
      matrix:
        os: [ubuntu-24.04]
        configuration: [Debug, Release]
        avx: [AVX512F]
    name: ${{ matrix.os }}-${{ matrix.configuration }}-${{ matrix.avx }}-CMake
    runs-on: ${{ matrix.os }}
    steps:
    - name: Skip Duplicate Actions
      uses: fkirc/skip-duplicate-actions@v5.3.1
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1 # https://github.com/marketplace/actions/setup-cpp-c-c
      with:
          compiler: gcc-14
    - name: configure
      run: |
        mkdir out && cd out
        cmake .. -DENABLE_${{ matrix.avx }}=ON -DCMAKE_INSTALL_PREFIX=${{ matrix.configuration }}
    - name: build
      run: |
        cd out
        # "-j" spawns too many processes causing GCC to crash
        cmake --build . -j 12
    - name: test
      run: |
        cd out
        ctest --output-on-failure
