env:
  CTEST_TIMEOUT: 120

name: build_unittest

on:
  push:
  pull_request:
    branches:
      - main


jobs:
  build-cmake-windows:
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.7']
    name: ${{ matrix.os }}-${{ matrix.python-version }}-CMake
    runs-on: ${{ matrix.os }}
    steps:
    - name: Skip Duplicate Actions
      uses: fkirc/skip-duplicate-actions@v5.3.1
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: Set up Python
      uses: actions/setup-python@v5 # https://github.com/marketplace/actions/setup-python
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install python dependencies
      run: |
        pip install numpy
    - name: configure
      run: |
        ls env:
        mkdir target-Release
        cd target-Release
        cmake .. -DCMAKE_INSTALL_PREFIX=install${{ matrix.os }}CMake-Github -DPYTHON_VERSION=${{ matrix.python-version }} -DENABLE_SWIG=ON
        cd ..
        mkdir target-Debug
        cd target-Debug
        cmake .. -DCMAKE_INSTALL_PREFIX=install${{ matrix.os }}CMake-Github -DENABLE_PYTHON=OFF
    - name: build
      run: |
        cd target-Release
        cmake --build . --config Release -j
        cd ..
        cd target-Debug
        cmake --build . --config Debug -j
    - name: test # should run w/o install
      run: |
        cd target-Release
        ctest -C Release --output-on-failure --timeout $env:CTEST_TIMEOUT
        cd ..
        cd target-Debug
        ctest -C Debug --output-on-failure --timeout $env:CTEST_TIMEOUT
    - name: install
      run: |
        cd target-Release
        cmake --build . --config Release --target install
        cd ..
        cd target-Debug
        cmake --build . --config Debug --target install
        cd ..

  build-linux-cmake-default:
    strategy:
      matrix:
        os: [ubuntu-22.04]
        python-version: ['3.7']
    name: ${{ matrix.os }}-${{ matrix.python-version }}-CMake
    runs-on: ${{ matrix.os }}
    steps:
    - name: Skip Duplicate Actions
      uses: fkirc/skip-duplicate-actions@v5.3.1
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - uses: j178/prek-action@v2 # https://github.com/j178/prek-action
    - name: Set up Python
      uses: actions/setup-python@v5 # https://github.com/marketplace/actions/setup-python
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install python dependencies
      run: |
        pip install numpy
    - name: configure
      run: |
        env
        which python
        mkdir target && cd target
        cmake .. -DCMAKE_INSTALL_PREFIX=install${{ matrix.os }}CMake-Github -DPYTHON_VERSION=${{ matrix.python-version }} -DENABLE_SWIG=ON
    - name: build
      run: |
        cd target
        cmake --build . -j
    - name: test
    # should run w/o install
      run: |
        cd target
        ctest --output-on-failure --timeout $CTEST_TIMEOUT
    - name: install
      run: |
        cd target
        cmake --build . --target install

  build-linux-cmake:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        configuration: [Debug, Release]
        avx: [AVX512F]
    name: ${{ matrix.os }}-${{ matrix.configuration }}-${{ matrix.avx }}-CMake
    runs-on: ${{ matrix.os }}
    steps:
    - name: Skip Duplicate Actions
      uses: fkirc/skip-duplicate-actions@v5.3.1
    - uses: actions/checkout@v4 # https://github.com/marketplace/actions/checkout
    - name: configure
      run: |
        mkdir out && cd out
        cmake .. -DENABLE_PYTHON=OFF -DENABLE_${{ matrix.avx }}=ON -DCMAKE_INSTALL_PREFIX=${{ matrix.configuration }}
    - name: build
      run: |
        cd out
        cmake --build .
    - name: test
    # should run w/o install
      run: |
        cd out
        ctest --output-on-failure --timeout $CTEST_TIMEOUT

